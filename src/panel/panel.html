<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Annotator</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="areas.css" />
    <link rel="stylesheet" href="controls.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <h1 class="panel-title">QA Annotator</h1>
        <p class="panel-mode" data-mode></p>
      </header>

      <section class="card current" aria-labelledby="current-title">
        <h2 class="section-title" id="current-title" data-current-title>
          New issue
        </h2>
        <p class="hint" data-hint></p>
        <ol class="areas" data-areas></ol>
        <div class="composer" data-composer hidden>
          <label class="field-label" for="comment" data-label>
            What is wrong here?
          </label>
          <textarea
            class="comment-field"
            id="comment"
            rows="7"
            spellcheck="true"
          ></textarea>
        </div>
        <p class="error" role="alert" data-compose-error hidden></p>
        <p class="keys" data-keys hidden>
          <kbd data-key="save"></kbd> save · <kbd data-key="addArea"></kbd> add
          area · <kbd data-key="cancel"></kbd> cancel
        </p>
        <div class="actions" data-actions hidden>
          <button class="button" type="button" data-cancel>Cancel</button>
          <button class="button" type="button" data-add-area>Add area</button>
          <button class="button button--primary" type="button" data-save>Save</button>
        </div>
      </section>

      <section class="issues" aria-labelledby="issues-title">
        <h2 class="section-title" id="issues-title">
          Issues on this site <span class="count" data-issue-count></span>
        </h2>
        <p class="empty" data-empty>None yet. Saved issues show up here.</p>
        <ol class="issue-list" data-issue-list></ol>
      </section>

      <footer class="panel-footer">
        <p class="status" role="status" data-status></p>
        <p class="error" role="alert" data-error hidden></p>
        <button
          class="button button--primary button--wide"
          type="button"
          data-finish
        >
          Finish session <kbd data-key="finish"></kbd>
        </button>
      </footer>
    </main>
  </body>
</html>
